<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Give</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Give</h1>
      <p class="lede">Your gift goes straight to the church you choose. Fees are shown on your receipt.</p>

      <form id="donation-form" novalidate>
        <label>
          Amount (USD)
          <input id="amount" name="amount" type="number" step="0.01" inputmode="decimal" placeholder="25.00" />
        </label>

        <label>
          Church
          <select id="church" name="church">
            <option value="church_grace">Grace Fellowship</option>
            <option value="church_hillside">Hillside Community</option>
          </select>
        </label>

        <label class="checkbox">
          <input id="recurring" name="recurring" type="checkbox" />
          Make this a monthly gift
        </label>

        <button type="submit">Give now</button>
      </form>

      <p id="message" role="status" hidden></p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
